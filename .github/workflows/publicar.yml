name: Publicar tablero

on:
  workflow_dispatch:            # botón manual y disparo desde "Actualizar datos"
  push:
    branches: [main]
    paths:                      # solo cuando cambia algo que afecta la página
      - "data/agregados/**"
      - "data/geo/**"
      - "src/visualizar.py"
      - "src/plantilla_tablero.html"
      - "src/geo.py"
      - "src/agregar.py"
      - "requirements.txt"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest

      - name: Correr las pruebas         # CD: si una prueba falla, no se publica
        run: pytest -q

      - name: Generar la página
        run: python -m src.visualizar

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
